# Fly.io configuration for Breadator (https://breadator.robinluiz.fr).
# Secrets are set with `fly secrets set`, never committed here.

app = "breadator"
primary_region = "fra"
kill_signal = "SIGTERM"
kill_timeout = "10s"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8080"
  PUBLIC_URL = "https://breadator.robinluiz.fr"
  DATABASE_PATH = "/data/breadator.sqlite3"
  LOG_FORMAT = "json"
  LOG_LEVEL = "info"

[[mounts]]
  source = "breadator_data"
  destination = "/data"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"

# One machine, always on: it owns the SQLite database on the volume (never scale to two: the
# volume belongs to one machine, and SQLite has one writer).
[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = "10s"
    interval = "30s"
    method = "GET"
    path = "/healthz"
    timeout = "5s"
