[package]
name = "breadator-content"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Breadator's knowledge base: articles and recipes with validated citations, rendered HTML and full-text search."
publish = false

[dependencies]
breadator-engine = { path = "../breadator-engine" }
pulldown-cmark = { version = "0.13.6", default-features = false, features = ["html"] }
rusqlite = { version = "0.43.0", features = ["bundled"] }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
toml = { version = "1.2.2", default-features = false, features = ["parse", "serde"] }
