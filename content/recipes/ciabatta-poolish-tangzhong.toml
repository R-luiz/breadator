bread_type = "lean-hearth"
sources = ["novita-0191", "novita-0194", "novita-0198", "novita-0192", "novita-0193", "novita-0196", "novita-0197"]
title = { fr = "Ciabatta sur poolish et tangzhong", en = "Ciabatta with poolish and tangzhong" }
description = { fr = "D'après la ciabatta de Novita Listyani : environ 79 % d'hydratation rendue maniable par 15 % de farine en empois, toute la levure dans une poolish d'une nuit, un mélange à la main et une cuisson sur plaque.", en = "After Novita Listyani's ciabatta: about 79 % hydration made manageable by a 15 % scald, all the yeast in an overnight poolish, mixed by hand and baked on a tray." }
steps = [
  { fr = "Poolish (la veille) : mélangez la levure à la farine de la poolish, ajoutez l'eau et remuez jusqu'à ce qu'il ne reste plus de farine sèche. Laissez environ 1 h à température ambiante (27–28 °C dans la source, plus longtemps dans une cuisine fraîche), puis gardez une nuit au réfrigérateur (environ 8 h). Utilisez-la à son sommet : bombée et pleine de bulles, avant qu'elle ne retombe.", en = "Poolish (the day before): whisk the yeast into the poolish flour, add the water and mix until no dry flour is left. Leave it about 1 h at room temperature (27–28 °C in the source, longer in a cooler kitchen), then refrigerate overnight (about 8 h). Use it at its peak: domed and bubbly, before it sinks back." },
  { fr = "Empois (la veille) : versez l'eau bouillante dans un bol préchauffé, ajoutez d'un coup la farine de l'empois et remuez 1 à 2 min jusqu'à obtenir une pâte épaisse et brillante. Couvrez, laissez refroidir, puis gardez une nuit au réfrigérateur.", en = "Scald (the day before): pour the boiling water into a pre-warmed bowl, add the scald flour at once and stir for 1 to 2 min into a thick, glossy paste. Cover, let it cool, then refrigerate overnight." },
  { fr = "Mélangez à la main la poolish, la farine, le sel et environ les trois quarts de l'eau du pétrin pendant 2 à 3 min.", en = "Mix the poolish, the flour, the salt and about three quarters of the final-mix water by hand for 2 to 3 min." },
  { fr = "Détendez l'empois froid et ferme avec le reste de l'eau (bassinage) et incorporez-le à la pâte en plusieurs fois, en le pressant dedans comme du beurre (environ 2 min chaque fois). Terminez par 1 à 2 min de soulevé-rabattu, jusqu'à ce que la pâte se tienne.", en = "Loosen the cold, stiff scald with the rest of the water and work it into the dough in several parts, squeezing it in as you would butter (about 2 min each). Finish with 1 to 2 min of slap-and-folds, until the dough holds together." },
  { fr = "Pointage à environ 27 °C : environ 4 séries de rabats à 30 min d'intervalle, la dernière par enroulement, puis environ 1 h sans y toucher. Le calculateur de fermentation donne la durée pour la température de votre pâte.", en = "Bulk fermentation at about 27 °C: about 4 rounds of stretch-and-folds at 30 min intervals, the last one as coil folds, then about 1 h undisturbed. The fermentation calculator gives the time for your own dough temperature." },
  { fr = "Renversez la pâte sur un plan fariné sans la dégazer, coupez-la en 2 ou 4 pâtons et déposez-les sur du papier cuisson.", en = "Turn the dough out on a floured bench without deflating it, cut it into 2 or 4 pieces and move them onto baking paper." },
  { fr = "Apprêt : environ 1 h à environ 27 °C, jusqu'à ce que les pâtons aient presque doublé et soient gonflés et fragiles. Une ciabatta trop peu poussée présente de grands tunnels béants.", en = "Final proof: about 1 h at about 27 °C, until almost doubled, puffy and fragile. An under-proofed ciabatta shows large gaping tunnels." },
  { fr = "Préchauffez le four à 230 °C. Cuisez 10 min à 220 °C en chaleur tournante (210 °C dans la vidéo), puis à 180 °C jusqu'à une couleur dorée foncée, 5 à 15 min de plus. Laissez refroidir complètement sur une grille : coupée tiède, la mie est collante.", en = "Preheat the oven to 230 °C. Bake 10 min at 220 °C with the fan (210 °C in the video), then at 180 °C until deep golden, 5 to 15 min more. Cool completely on a rack: cut warm, the crumb is gummy." },
]
notes = { fr = "Fournée de la source pour 2 à 4 ciabattas : poolish de 100 g de farine, 100 g d'eau et 0,6 g de levure instantanée ; empois de 40 g de farine et 80 g d'eau bouillante ; pétrin de 125 g de farine, 30 g d'eau et 4,5 g de sel. Aucune levure n'est ajoutée au pétrin. L'autrice précise qu'une poolish et un empois préparés quelques heures avant fonctionnent aussi, la nuit de repos servant au goût. La source ne dit pas combien d'eau l'empois perd en refroidissant : pesez-le froid et rajoutez ce qui manque. Les pourcentages sont arrondis à 0,01 point (0,001 en dessous de 1 %) ; les poids donnés par le calculateur restent à moins de 0,3 % de ceux de la source.", en = "Source batch for 2 to 4 ciabattas: poolish of 100 g flour, 100 g water and 0.6 g instant yeast; scald of 40 g flour and 80 g boiling water; final mix of 125 g flour, 30 g water and 4.5 g salt. No yeast is added to the final mix. The author says a poolish and scald made a few hours ahead also work, the overnight rest being for flavour. The source does not say how much water the scald loses on cooling: weigh it cold and add back what is missing. Percentages are rounded to 0.01 point (0.001 below 1 %); the weights the calculator gives stay within 0.3 % of the source's." }

