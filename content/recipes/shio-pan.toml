bread_type = "rolls"
sources = ["novita-0568", "novita-0569", "novita-0575", "novita-0574", "novita-0566", "novita-0571", "novita-0570"]
title = { fr = "Shio pan croustillants (petits pains au sel)", en = "Crispy shio pan (salt bread rolls)" }
description = { fr = "D'après les shio pan de Novita Listyani : cinq petits pains au sel fourrés de beurre, sur poolish et tangzhong, qui restent croustillants sans vapeur grâce à une fine glaçure cuite à la farine de riz.", en = "After Novita Listyani's shio pan: five butter-filled salt rolls on poolish and tangzhong, kept crisp without steam by a thin cooked rice-flour glaze." }
steps = [
  { fr = "Empois (la veille) : versez l'eau bouillante dans un bol préchauffé, ajoutez d'un coup la farine de l'empois et remuez 1 à 2 min jusqu'à obtenir une pâte épaisse et lisse. Couvrez, laissez refroidir, puis gardez une nuit au réfrigérateur.", en = "Scald (the day before): pour the boiling water into a pre-warmed bowl, add the scald flour at once and stir for 1–2 min into a thick, smooth paste. Cover, let it cool, then refrigerate overnight." },
  { fr = "Poolish (la veille) : mélangez la levure à la farine de la poolish, ajoutez l'eau et remuez jusqu'à ce qu'il ne reste plus de farine sèche. Laissez environ 1 h à température ambiante (27–28 °C dans la source, plus longtemps dans une cuisine fraîche), puis gardez une nuit au réfrigérateur (environ 8 h). Utilisez-la à son sommet : bombée et pleine de bulles, avant qu'elle ne retombe.", en = "Poolish (the day before): whisk the yeast into the poolish flour, add the water and mix until no dry flour is left. Leave it about 1 h at room temperature (27–28 °C in the source, longer in a cooler kitchen), then refrigerate overnight (about 8 h). Use it at its peak: domed and bubbly, before it sinks back." },
  { fr = "Au robot pétrisseur, mélangez la poolish, les deux farines, le sel, le sucre et environ les trois quarts du lait pendant 3 min à vitesse moyenne. Détendez l'empois avec le reste du lait, ajoutez-le et pétrissez 4 à 5 min. Ajoutez le beurre ramolli et pétrissez encore 6 à 8 min : la pâte est lisse, souple, encore un peu collante, et passe le test du voile.", en = "In a stand mixer, mix the poolish, both flours, the salt, the sugar and about three quarters of the milk for 3 min on medium speed. Loosen the scald with the rest of the milk, add it and mix 4 to 5 min. Add the softened butter and mix 6 to 8 min more: the dough is smooth, supple and still slightly tacky, and passes the windowpane test." },
  { fr = "Pointage : environ 1 h à environ 27 °C, jusqu'au doublement. Le calculateur de fermentation donne la durée pour la température de votre pâte.", en = "Bulk fermentation: about 1 h at about 27 °C, until doubled. The fermentation calculator gives the time for your own dough temperature." },
  { fr = "Divisez en 5 pâtons, préfaçonnez-les en cônes et laissez 15 min de détente ; dans une cuisine chaude, 20 à 30 min au réfrigérateur facilitent le façonnage.", en = "Divide into 5 pieces, preshape them into cones and rest 15 min; in a warm kitchen, 20 to 30 min in the refrigerator make them easier to shape." },
  { fr = "Abaissez chaque cône en un long triangle effilé de 6 à 7 cm de base. Posez un bâtonnet de 15 g de beurre froid sur la base, soudez la pâte autour et roulez serré vers la pointe. Ce beurre de garniture (75 g pour 5 pains) ne figure pas dans la formule.", en = "Roll each cone into a long tapered triangle with a base of 6 to 7 cm. Put a 15 g stick of cold butter on the base, seal the dough around it and roll up tightly towards the tip. This filling butter (75 g for 5 rolls) is not in the formula." },
  { fr = "Apprêt : environ 1 h à environ 27 °C, jusqu'à ce que les pains aient doublé et soient bien aérés.", en = "Final proof: about 1 h at about 27 °C, until doubled and airy." },
  { fr = "Glaçure : cuisez 10 g de farine de riz avec 150 g d'eau pendant 2 à 3 min en remuant, jusqu'à épaississement. Passez-en une seule couche fine sur les pains et parsemez de gros sel.", en = "Glaze: cook 10 g of rice flour with 150 g of water for 2 to 3 min, stirring, until thick. Brush a single thin coat on the rolls and sprinkle with coarse salt." },
  { fr = "Préchauffez le four à 230 °C. Cuisez sans vapeur sur une grille haute : 15 min à 200 °C en chaleur tournante, puis 10 à 15 min à 180 °C, jusqu'à une couleur dorée foncée. Sortez les pains aussitôt et badigeonnez-les de beurre fondu.", en = "Preheat the oven to 230 °C. Bake without steam on an upper rack: 15 min at 200 °C with the fan, then 10 to 15 min at 180 °C, until deep golden. Take the rolls out at once and brush them with melted butter." },
]
notes = { fr = "Fournée de la source pour 5 pains : empois de 45 g de farine de force et 70 g d'eau bouillante ; poolish de 50 g de farine de force, 50 g d'eau et 0,5 g de levure instantanée ; pétrin de 70 g de farine de force, 50 g de farine ordinaire, 35 g de lait, 12 g de sucre, 15 g de beurre et 4 g de sel. Aucune levure n'est ajoutée au pétrin. Le beurre de garniture, la glaçure et le gros sel sont hors formule. Dans l'essai de l'autrice, deux couches de glaçure donnaient plus de croustillant au départ mais le perdaient bien plus vite qu'une seule. Le beurre qui coule sur la plaque peut brûler la base avant que le dessus soit pris : cuisez en haut du four, un peu plus longtemps, pour sécher la croûte. La glaçure part d'un rapport de 1:15 de farine de riz pour l'eau ; l'autrice la décrit à environ 1:9 à 1:10 une fois cuite. La source ne dit pas combien d'eau l'empois perd en refroidissant : pesez-le froid et rajoutez ce qui manque. Les pourcentages sont arrondis à 0,01 point (0,001 en dessous de 1 %) ; les poids donnés par le calculateur restent à moins de 0,2 % de ceux de la source.", en = "Source batch for 5 rolls: scald of 45 g bread flour and 70 g boiling water; poolish of 50 g bread flour, 50 g water and 0.5 g instant yeast; final mix of 70 g bread flour, 50 g all-purpose flour, 35 g milk, 12 g sugar, 15 g butter and 4 g salt. No yeast is added to the final mix. The filling butter, the glaze and the coarse salt are outside the formula. In the author's own trial, two coats of glaze were crisper at first but lost their crispness much faster than one. The butter that runs out onto the tray can burn the base before the top sets: bake high in the oven, a little longer, to dry the crust. The glaze starts at 1:15 rice flour to water; the author describes it as about 1:9 to 1:10 once cooked. The source does not say how much water the scald loses on cooling: weigh it cold and add back what is missing. Percentages are rounded to 0.01 point (0.001 below 1 %); the weights the calculator gives stay within 0.2 % of the source's." }

