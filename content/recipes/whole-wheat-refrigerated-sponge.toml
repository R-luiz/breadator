bread_type = "whole-grain"
sources = ["novita-0034", "novita-0035", "novita-0036", "novita-0037", "novita-0038", "novita-0039", "novita-0041", "novita-0040", "novita-0042", "novita-0024", "zeng2023"]
title = { fr = "Pâte 100 % complète sur levain-levure réfrigéré de 18 h", en = "100 % whole-wheat dough with an 18-hour refrigerated sponge" }
description = { fr = "D'après la pâte complète polyvalente de Novita Listyani : 45 % de la farine fermente 18 h au réfrigérateur, 10 % est en empois, et la pâte donne un pain de mie moelleux, des petits pains ou des pitas.", en = "After Novita Listyani's all-purpose whole-wheat dough: 45 % of the flour ferments 18 h in the refrigerator, 10 % is scalded, and the dough makes a soft pan loaf, rolls or pitas." }
steps = [
  { fr = "Levain-levure : mélangez la levure à la farine du levain-levure, ajoutez l'eau et remuez ; cela prend moins d'une minute. Couvrez et mettez directement au réfrigérateur pour 18 h. L'autrice l'a gardé plus longtemps avec de bons résultats.", en = "Sponge: whisk the yeast into the sponge flour, add the water and mix; it takes under a minute. Cover and put it straight into the refrigerator for 18 h. The author has kept it longer with good results." },
  { fr = "Empois : chauffez un bol à l'eau chaude et videz-le. Sur une balance, versez l'eau bouillante, ajoutez d'un coup la farine de l'empois et remuez jusqu'à obtenir une pâte. Couvrez et réfrigérez à côté du levain-levure.", en = "Scald: warm a bowl with hot water and empty it. On a scale, pour in the boiling water, add the scald flour at once and stir to a paste. Cover and refrigerate next to the sponge." },
  { fr = "Le lendemain, mélangez le levain-levure, la farine, le miel, le sel et le lait et pétrissez à la main 4 à 5 min, jusqu'à homogénéité, pour amorcer le gluten. Un robot pétrisseur convient aussi.", en = "The next day, mix the sponge, flour, honey, salt and milk and knead by hand for 4 to 5 min, until homogeneous, to start the gluten. A stand mixer works too." },
  { fr = "Ajoutez l'empois et le beurre ramolli en rabattant les bords de la pâte par-dessus, et pétrissez encore 4 à 5 min. Poursuivez en soulevé-rabattu jusqu'à ce que la pâte soit lisse et passe le test du voile.", en = "Add the scald and the softened butter by folding the edges of the dough over them, and knead 4 to 5 min more. Go on with slap-and-folds until the dough is smooth and passes the windowpane test." },
  { fr = "Pointage : jusqu'au doublement, environ 1 h 30 dans la cuisine chaude de l'autrice (27–28 °C), plus longtemps dans une pièce plus fraîche, ou au réfrigérateur. Le calculateur de fermentation donne la durée pour la température de votre pâte.", en = "Bulk fermentation: until doubled, about 1.5 h in the author's warm kitchen (27–28 °C), longer in a cooler room, or in the refrigerator. The fermentation calculator gives the time for your own dough temperature." },
  { fr = "Pain de mie : divisez en 2 pâtons, boulez-les et laissez 15 min de détente. Abaissez chacun en un long rectangle, roulez serré, et posez les deux rouleaux aux spirales opposées dans un moule à pain de mie graissé, avec couvercle. Laissez pousser environ 1 h, jusqu'à juste sous le couvercle, puis cuisez à 190 °C pendant 30 à 35 min.", en = "Pan loaf: divide into 2 pieces, round them and rest 15 min. Roll each one into a long rectangle, roll it up tightly, and place the two rolls with opposite spirals in a greased lidded loaf pan. Proof about 1 h, until just under the lid, then bake at 190 °C for 30 to 35 min." },
  { fr = "Petits pains : divisez en 8 pâtons, boulez-les, laissez 15 min de détente, puis reboulez-les serré et posez-les dans un moule graissé. Laissez pousser environ 1 h, jusqu'à ce qu'ils soient gonflés, puis cuisez à 175 °C sur la grille du bas pendant 20 à 25 min ; couvrez de papier cuisson si le dessus fonce.", en = "Rolls: divide into 8 pieces, round them, rest 15 min, then round them again tightly and place them in a greased pan. Proof about 1 h, until puffy, then bake at 175 °C on the bottom rack for 20 to 25 min; cover with baking paper if the top darkens." },
  { fr = "Pitas : abaissez les pâtons boulés en disques plats, laissez 30 min, et cuisez-les dans une poêle chauffée à environ 200 °C, en les pressant et en les retournant jusqu'à ce qu'elles soient entièrement gonflées, puis 1 à 2 min sur l'autre face.", en = "Pitas: roll the rounded pieces into flat discs, rest 30 min, and cook them in a pan heated to about 200 °C, pressing them down and flipping until fully puffed, then 1 to 2 min on the other side." },
]
notes = { fr = "Fournée de la source : empois de 40 g de farine complète et 80 g d'eau bouillante ; levain-levure de 170 g de farine complète, 170 g d'eau et 2 g de levure instantanée (que la source appelle poolish) ; pétrin de 165 g de farine complète, 45 g de lait, 20 g de miel, 25 g de beurre et 6,5 g de sel. La description indique 11 % pour le miel ; ses 20 g font 5,3 % de la farine, et ce sont les pesées qui sont suivies ici. L'hydratation qu'elle annonce (289 g, environ 77 %) compte l'eau et 87 % du lait. La méthode reprend le procédé sur levain-levure réfrigéré (refrigerated sponge and dough) de Zeng et collaborateurs (2023), où environ la moitié de la farine complète fermente 18 h au froid ; l'autrice précise qu'elle ne suit pas l'article à la lettre. La source ne dit pas combien d'eau l'empois perd en refroidissant : pesez-le froid et rajoutez ce qui manque. Les pourcentages sont arrondis à 0,01 point (0,001 en dessous de 1 %) ; les poids donnés par le calculateur restent à moins de 0,2 % de ceux de la source.", en = "Source batch: scald of 40 g whole-wheat flour and 80 g boiling water; sponge of 170 g whole-wheat flour, 170 g water and 2 g instant yeast (what the source calls a poolish); final mix of 165 g whole-wheat flour, 45 g milk, 20 g honey, 25 g butter and 6.5 g salt. The description lists the honey as 11 %; its 20 g are 5.3 % of the flour, and the weights are followed here. Her stated hydration (289 g, about 77 %) counts the water and 87 % of the milk. The method follows the refrigerated sponge-and-dough process of Zeng and co-workers (2023), in which about half the whole-wheat flour ferments 18 h in the cold; the author says she does not follow the paper to the letter. The source does not say how much water the scald loses on cooling: weigh it cold and add back what is missing. Percentages are rounded to 0.01 point (0.001 below 1 %); the weights the calculator gives stay within 0.2 % of the source's." }

