bread_type = "rolls"
sources = ["novita-0353", "novita-0354", "novita-0356", "novita-0355", "novita-0352", "novita-0360", "novita-0359", "novita-0358"]
title = { fr = "Pains à sandwich longs sur tangzhong et poolish", en = "Soft sub rolls with tangzhong and poolish" }
description = { fr = "D'après les « sub rolls » de Novita Listyani : cinq pains à sandwich moelleux, à l'eau plutôt qu'au lait, avec 20 % de la farine en empois, une poolish d'une nuit et un peu de beurre et de sucre.", en = "After Novita Listyani's sub rolls: five soft sandwich rolls made with water rather than milk, 20 % of the flour scalded, an overnight poolish and a little butter and sugar." }
steps = [
  { fr = "Empois (la veille) : versez l'eau bouillante dans un bol préchauffé, ajoutez d'un coup la farine de l'empois et remuez 1 à 2 min jusqu'à obtenir une pâte épaisse et lisse. Couvrez, laissez refroidir, puis gardez une nuit au réfrigérateur.", en = "Scald (the day before): pour the boiling water into a pre-warmed bowl, add the scald flour at once and stir for 1–2 min into a thick, smooth paste. Cover, let it cool, then refrigerate overnight." },
  { fr = "Poolish (la veille) : mélangez la levure à la farine de la poolish, ajoutez l'eau et remuez jusqu'à ce qu'il ne reste plus de farine sèche. Laissez environ 1 h à température ambiante (27–28 °C dans la source, plus longtemps dans une cuisine fraîche), puis gardez une nuit au réfrigérateur (environ 8 h). Utilisez-la à son sommet : bombée et pleine de bulles, avant qu'elle ne retombe.", en = "Poolish (the day before): whisk the yeast into the poolish flour, add the water and mix until no dry flour is left. Leave it about 1 h at room temperature (27–28 °C in the source, longer in a cooler kitchen), then refrigerate overnight (about 8 h). Use it at its peak: domed and bubbly, before it sinks back." },
  { fr = "Au robot pétrisseur, mélangez l'empois, la poolish, l'eau, la farine, le sucre et le sel pendant 3 à 4 min à vitesse moyenne, jusqu'à ce que la pâte soit lisse et monte sur le crochet.", en = "In a stand mixer, mix the scald, poolish, water, flour, sugar and salt for 3 to 4 min on medium speed, until the dough is smooth and climbs the hook." },
  { fr = "Ajoutez le beurre ramolli, une fois le gluten en partie formé, et pétrissez encore 5 à 6 min à vitesse moyenne, jusqu'au test du voile. Ces durées sont celles du robot de la source : suivez l'ordre plutôt que l'horloge.", en = "Add the softened butter, once the gluten is partly developed, and mix 5 to 6 min more on medium speed, until the windowpane test. These times are those of the source's mixer: follow the order rather than the clock." },
  { fr = "Pointage : environ 1 h à environ 27 °C, jusqu'à ce que la pâte ait presque doublé. Le calculateur de fermentation donne la durée pour la température de votre pâte.", en = "Bulk fermentation: about 1 h at about 27 °C, until almost doubled. The fermentation calculator gives the time for your own dough temperature." },
  { fr = "Divisez en 5 pâtons au poids, laissez 10 min de détente, puis façonnez en pains longs et posez-les sur une plaque.", en = "Divide into 5 pieces by weight, rest 10 min, then shape into long rolls and set them on a baking tray." },
  { fr = "Apprêt : environ 1 h à environ 27 °C, jusqu'à ce que les pains aient presque doublé.", en = "Final proof: about 1 h at about 27 °C, until nearly doubled." },
  { fr = "Cuisez à 175 °C en chaleur statique (voûte et sole), sur la grille du milieu, environ 20 min. Badigeonnez les pains chauds de beurre fondu (de lait dans la vidéo).", en = "Bake at 175 °C with top and bottom heat on the middle rack for about 20 min. Brush the hot rolls with melted butter (milk in the video)." },
]
notes = { fr = "Fournée de la source pour 5 pains : empois de 65 g de farine et 100 g d'eau bouillante ; poolish de 80 g de farine, 80 g d'eau et 0,8 g de levure instantanée ; pétrin de 180 g de farine, 46 g d'eau, 25 g de sucre, 25 g de beurre et 6 g de sel. Aucune levure n'est ajoutée au pétrin. L'autrice recommande 6 à 8 % de sucre et 6 à 8 % de beurre pour des pains moelleux de ce type. La source ne dit pas combien d'eau l'empois perd en refroidissant : pesez-le froid et rajoutez ce qui manque. Les pourcentages sont arrondis à 0,01 point (0,001 en dessous de 1 %) ; les poids donnés par le calculateur restent à moins de 0,3 % de ceux de la source.", en = "Source batch for 5 rolls: scald of 65 g flour and 100 g boiling water; poolish of 80 g flour, 80 g water and 0.8 g instant yeast; final mix of 180 g flour, 46 g water, 25 g sugar, 25 g butter and 6 g salt. No yeast is added to the final mix. The author recommends 6 to 8 % sugar and 6 to 8 % butter for soft rolls of this kind. The source does not say how much water the scald loses on cooling: weigh it cold and add back what is missing. Percentages are rounded to 0.01 point (0.001 below 1 %); the weights the calculator gives stay within 0.3 % of the source's." }

