bread_type = "lean-hearth"
sources = ["novita-0577", "novita-0580", "novita-0578", "novita-0579", "novita-0582", "novita-0581", "novita-0576"]
title = { fr = "Baguettes sur poolish et tangzhong", en = "Baguettes with poolish and tangzhong" }
description = { fr = "D'après les baguettes au four ménager de Novita Listyani : quatre baguettes à 72 % d'hydratation, avec une poolish au froid pour le goût et 10 % de farine en empois pour que la mie supporte une cuisson longue.", en = "After Novita Listyani's home-oven baguettes: four lean baguettes at 72 % hydration, with a cold poolish for flavour and a 10 % scald so the crumb survives a long bake." }
steps = [
  { fr = "Empois (la veille) : versez l'eau bouillante dans un bol préchauffé, ajoutez d'un coup la farine de l'empois et remuez 1 à 2 min jusqu'à obtenir une pâte épaisse et lisse. Couvrez, laissez refroidir, puis gardez une nuit au réfrigérateur.", en = "Scald (the day before): pour the boiling water into a pre-warmed bowl, add the scald flour at once and stir for 1–2 min into a thick, smooth paste. Cover, let it cool, then refrigerate overnight." },
  { fr = "Poolish (la veille) : mélangez sa farine, son eau et sa levure dans un bol assez grand pour qu'elle gonfle. Laissez environ 1 h à température ambiante, puis environ 12 h au réfrigérateur, jusqu'à ce qu'elle soit pleine de bulles, tremblotante et légèrement retombée après son sommet.", en = "Poolish (the day before): mix its flour, water and yeast in a bowl large enough for it to expand. Leave it about 1 h at room temperature, then about 12 h in the refrigerator, until bubbly, wobbly and slightly sunk after its peak." },
  { fr = "Délayez la poolish et l'empois dans l'eau du pétrin avec le sel et le reste de levure. Ajoutez les deux farines, mélangez 1 à 2 min à la corne, puis travaillez 5 à 6 min en soulevé-rabattu (slap and fold) sur le plan de travail, jusqu'à ce que la pâte colle moins.", en = "Dissolve the poolish and the scald in the final-mix water with the salt and the remaining yeast. Add both flours, combine for 1 to 2 min with a scraper, then slap and fold on the bench for 5 to 6 min, until the dough is less sticky." },
  { fr = "Laissez 30 min, puis donnez 8 rabats ; 30 min, 8 autres ; 30 min, puis une dernière série de 4 et quelques rabats par enroulement. La pâte doit passer le test du voile.", en = "Rest 30 min, then 8 stretch-and-folds; rest 30 min, 8 more; rest 30 min, then a last set of 4 and a few coil folds. The dough should pass the windowpane test." },
  { fr = "Pointage : jusqu'au doublement, environ 40 min de plus dans la cuisine très chaude de la source. Le calculateur de fermentation donne la durée pour la température de votre pâte. La pâte peut aussi passer la nuit au réfrigérateur ; laissez-la revenir à température ambiante avant de diviser.", en = "Bulk fermentation: until doubled, about 40 min more in the source's very warm kitchen. The fermentation calculator gives the time for your own dough temperature. The dough can also spend the night in the refrigerator; let it come back to room temperature before dividing." },
  { fr = "Divisez en 4 pâtons. Préfaçonnez sans serrer en boudins courts, en ne farinant que l'extérieur pour ne pas enfermer de farine sèche, et laissez environ 15 min de détente.", en = "Divide into 4 pieces. Preshape loosely into short rolls, flouring only the outside so that no dry flour gets folded in, and rest about 15 min." },
  { fr = "Façonnez les baguettes et posez-les sur une couche (un linge) bien farinée à la farine de riz, plissée entre chacune. Apprêt : environ 45 min dans une cuisine chaude, ou plus longtemps au réfrigérateur.", en = "Shape the baguettes and set them on a cloth well dusted with rice flour, pleated between each. Final proof: about 45 min in a warm kitchen, or longer in the refrigerator." },
  { fr = "Préchauffez le four au maximum pendant 30 min (environ 230 °C réels dans la source) avec un récipient résistant à la chaleur sur la sole. Grignez lame inclinée, versez de l'eau bouillante dans le récipient et enfournez aussitôt.", en = "Preheat the oven at its highest setting for 30 min (about 230 °C actual in the source) with a heat-proof container on the bottom. Score with a tilted blade, pour boiling water into the container and load the baguettes at once." },
  { fr = "Cuisez 25 à 30 min en sole seule avec la buée. Retirez le récipient, passez en chaleur statique (voûte et sole) à environ 210 °C pendant 5 min, puis en voûte seule 10 à 15 min, jusqu'à une couleur brun doré foncé.", en = "Bake 25 to 30 min with bottom heat and steam. Remove the container, switch to top and bottom heat at about 210 °C for 5 min, then to top heat for 10 to 15 min, until dark golden brown." },
]
notes = { fr = "Fournée de la source : empois de 50 g de farine de force et 100 g d'eau bouillante ; poolish de 50 g de farine de force, 50 g d'eau et 0,5 g de levure instantanée ; pétrin de 300 g de farine de force, 100 g de farine ordinaire, 210 g d'eau, 10 g de sel et 1 g de levure instantanée. L'autrice mélange les deux farines pour approcher une T65 française ; cette équivalence est propre à ses farines. La cuisson est celle d'un four ménager électrique sans pierre ; les durées sont approximatives et dépendent du four. Une pâte retardée une nuit au froid donne une croûte parsemée de petites cloques. La source ne dit pas combien d'eau l'empois perd en refroidissant : pesez-le froid et rajoutez ce qui manque. Les pourcentages sont arrondis à 0,01 point (0,001 en dessous de 1 %) ; les poids donnés par le calculateur restent à moins de 0,1 % de ceux de la source.", en = "Source batch: scald of 50 g bread flour and 100 g boiling water; poolish of 50 g bread flour, 50 g water and 0.5 g instant yeast; final mix of 300 g bread flour, 100 g all-purpose flour, 210 g water, 10 g salt and 1 g instant yeast. The author blends the two flours to get close to a French T65; that match is specific to her flours. The bake is the one of an electric home oven without stone; the times are approximate and depend on the oven. A dough retarded overnight shows small blisters on the crust. The source does not say how much water the scald loses on cooling: weigh it cold and add back what is missing. Percentages are rounded to 0.01 point (0.001 below 1 %); the weights the calculator gives stay within 0.1 % of the source's." }

