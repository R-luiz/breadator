[workspace]
resolver = "3"
members = ["crates/breadator-engine", "crates/breadator-wasm", "crates/breadator-content", "crates/breadator-server"]

[workspace.package]
edition = "2024"
rust-version = "1.88"
license = "MIT"
repository = "https://github.com/R-luiz/breadator"

[workspace.dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"

[profile.release]
# One 256 MB Fly machine and a WASM bundle for phones: small binaries, no unwinding tables.
lto = "thin"
codegen-units = 1
panic = "abort"
strip = true

[profile.release.package.breadator-wasm]
opt-level = "z"
